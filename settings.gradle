pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "Pdialer"
include ':app'
include ':recorder'
include ':networkswitch'
include ':hiddenapi'
include ':LibreGlass'
include ':LibreGlassShowcase'
include ':LibreGlassReference1Test'

// Isolated Reference #2 experiment (upstream core + Compose renderer + test app).
include ':LibreGlassReference2Core', ':LibreGlassReference2Compose', ':LibreGlassReference2Test'
project(':LibreGlassReference2Core').projectDir = file('LibreGlassReference2Test/reference/liquidglass-core')
project(':LibreGlassReference2Compose').projectDir = file('LibreGlassReference2Test/reference/liquidglass-compose')
